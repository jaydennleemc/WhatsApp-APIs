<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>WhatsApp API Authentication</title>
        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- QR Code Library -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
        <!-- Font Awesome for icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <style>
            .whatsapp-border {
                border: 8px solid #f3f4f6;
            }
            .pulse {
                animation: pulse 2s infinite;
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.7;
                }
            }
        </style>
    </head>
    <body class="bg-gray-100 min-h-screen flex flex-col">
        <!-- Fixed Header -->
        <header class="bg-white shadow fixed top-0 left-0 right-0 z-10">
            <div class="max-w-4xl mx-auto px-4 py-4">
                <div class="flex items-center">
                    <div class="flex-shrink-0 bg-green-500 w-10 h-10 rounded-lg flex items-center justify-center">
                        <i class="fas fa-comment-alt text-white text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <h1 class="text-xl font-bold text-gray-800">WhatsApp API</h1>
                        <p class="text-sm text-gray-600">Secure Authentication</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow flex items-center justify-center p-4 pt-20 pb-16">
            <!-- Added pt-20 to account for fixed header and pb-16 for fixed footer -->
            <div class="w-full max-w-md bg-white rounded-xl shadow-lg overflow-hidden mt-16">
                <!-- Added mt-16 to account for fixed header -->
                <div id="main-content">
                    <!-- Dynamic content will be inserted here -->
                </div>
            </div>
        </main>

        <!-- Fixed Footer -->
        <footer class="bg-gray-50 py-4 text-center border-t fixed bottom-0 left-0 right-0 z-10">
            <p class="text-gray-600 text-sm">Your messages are end-to-end encrypted and secure</p>
        </footer>

        <script>
            // This script will handle the dynamic content based on authentication status
            document.addEventListener('DOMContentLoaded', async function () {
                const mainContent = document.getElementById('main-content');

                // Show loading state initially
                mainContent.innerHTML = `
                <div class="p-8 text-center">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mb-4">
                        <i class="fas fa-spinner animate-spin text-2xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">Initializing WhatsApp Connection</h2>
                    <p class="text-gray-600 mb-4">
                        Please wait while we prepare the authentication...
                    </p>
                    <div class="text-sm text-gray-500">
                        <p>This may take a few seconds</p>
                    </div>
                </div>
            `;

                try {
                    // Check authentication status first
                    const statusResponse = await fetch('/auth/status');
                    const statusData = await statusResponse.json();

                    if (statusData.data.authenticated) {
                        // Show authenticated message
                        mainContent.innerHTML = `
                        <div class="p-8 text-center">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-100 text-green-600 mb-4">
                                <i class="fas fa-check text-2xl"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-gray-800 mb-2">WhatsApp Authenticated</h2>
                            <p class="text-gray-600 mb-6">
                                You can now close this window and use the API.
                            </p>
                            <div class="mt-6">
                                <a href="/" class="inline-block bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-6 rounded-lg transition duration-300">
                                    Refresh Status
                                </a>
                            </div>
                        </div>
                    `;
                    } else {
                        // Check if QR code is available
                        let qrCodeAvailable = false;
                        let qrCodeData = null;

                        // Keep checking for QR code availability
                        const checkQrInterval = setInterval(async () => {
                            try {
                                const qrResponse = await fetch('/auth/qrcode/availability');
                                const qrData = await qrResponse.json();

                                if (qrData.data.qrCodeAvailable) {
                                    qrCodeAvailable = true;
                                    qrCodeData = qrData.data.qrCode;
                                    clearInterval(checkQrInterval);

                                    // Show QR code for authentication
                                    mainContent.innerHTML = `
                                    <div class="p-8">
                                        <div class="text-center mb-8">
                                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-100 text-green-600 mb-4">
                                                <i class="fas fa-qrcode text-2xl"></i>
                                            </div>
                                            <h2 class="text-2xl font-bold text-gray-800 mb-2">Scan the QR Code</h2>
                                            <p class="text-gray-600">
                                                Open WhatsApp on your phone, tap the menu icon, then tap "Linked Devices" and scan the QR code below.
                                            </p>
                                        </div>
                                        
                                        <!-- QR Code Container -->
                                        <div class="flex justify-center mb-6">
                                            <div id="qrcode-container" class="bg-white p-4 rounded-xl shadow-lg whatsapp-border pulse">
                                                <div id="qrcode-1" class="flex justify-center"></div>
                                            </div>
                                        </div>
                                        
                                        <!-- Status Info -->
                                        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
                                            <div class="flex items-start">
                                                <div class="flex-shrink-0">
                                                    <i class="fas fa-info-circle text-blue-500 text-xl"></i>
                                                </div>
                                                <div class="ml-3">
                                                    <h3 class="text-sm font-medium text-blue-800">Important Notice</h3>
                                                    <div class="mt-2 text-sm text-blue-700">
                                                        <p>This connection will sync your WhatsApp messages with the API server securely.</p>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <!-- Status Indicator -->
                                        <div class="flex items-center justify-center mb-4">
                                            <div class="flex items-center text-green-600">
                                                <div class="w-3 h-3 bg-green-500 rounded-full mr-2 animate-pulse"></div>
                                                <span class="text-sm font-medium">Ready to connect</span>
                                            </div>
                                        </div>
                                        
                                        <!-- Steps -->
                                        <div class="mt-6">
                                            <h3 class="text-lg font-semibold text-gray-800 mb-3 text-center">How to connect:</h3>
                                            <ol class="space-y-3">
                                                <li class="flex items-start">
                                                    <span class="flex items-center justify-center h-6 w-6 rounded-full bg-green-500 text-white text-xs font-bold mr-3 flex-shrink-0">1</span>
                                                    <span class="text-gray-700">Open WhatsApp on your phone</span>
                                                </li>
                                                <li class="flex items-start">
                                                    <span class="flex items-center justify-center h-6 w-6 rounded-full bg-green-500 text-white text-xs font-bold mr-3 flex-shrink-0">2</span>
                                                    <span class="text-gray-700">Tap the menu icon (Android) or Settings (iOS)</span>
                                                </li>
                                                <li class="flex items-start">
                                                    <span class="flex items-center justify-center h-6 w-6 rounded-full bg-green-500 text-white text-xs font-bold mr-3 flex-shrink-0">3</span>
                                                    <span class="text-gray-700">Select "Linked Devices"</span>
                                                </li>
                                                <li class="flex items-start">
                                                    <span class="flex items-center justify-center h-6 w-6 rounded-full bg-green-500 text-white text-xs font-bold mr-3 flex-shrink-0">4</span>
                                                    <span class="text-gray-700">Point your phone at this QR code to scan</span>
                                                </li>
                                            </ol>
                                        </div>
                                    </div>
                                `;

                                    // Generate QR code with the actual data
                                    const qrContainer = document.getElementById('qrcode-1');
                                    qrContainer.innerHTML = '';

                                    // Create new QR code
                                    new QRCode(qrContainer, {
                                        text: qrCodeData,
                                        width: 256,
                                        height: 256,
                                        colorDark: '#075E54',
                                        colorLight: '#ffffff',
                                        correctLevel: QRCode.CorrectLevel.H,
                                    });

                                    // Start polling for authentication status
                                    const pollAuthStatus = setInterval(async () => {
                                        try {
                                            const response = await fetch('/auth/status');
                                            const data = await response.json();

                                            if (data.data.authenticated) {
                                                mainContent.innerHTML = `
                                                <div class="p-8 text-center">
                                                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-100 text-green-600 mb-4">
                                                        <i class="fas fa-check text-2xl"></i>
                                                    </div>
                                                    <h2 class="text-2xl font-bold text-gray-800 mb-2">WhatsApp Authenticated</h2>
                                                    <p class="text-gray-600 mb-6">
                                                        You can now close this window and use the API.
                                                    </p>
                                                    <div class="mt-6">
                                                        <a href="/" class="inline-block bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-6 rounded-lg transition duration-300">
                                                            Refresh Status
                                                        </a>
                                                    </div>
                                                </div>
                                            `;
                                                clearInterval(pollAuthStatus);
                                            }
                                        } catch (error) {
                                            console.error('Error checking authentication status:', error);
                                        }
                                    }, 2000);
                                }
                            } catch (error) {
                                console.error('Error checking QR code availability:', error);
                            }
                        }, 1000); // Check every second
                    }
                } catch (error) {
                    console.error('Error loading content:', error);
                    mainContent.innerHTML = `
                    <div class="p-8 text-center">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-100 text-red-600 mb-4">
                            <i class="fas fa-exclamation-triangle text-2xl"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-gray-800 mb-2">Error</h2>
                        <p class="text-gray-600">
                            Could not load authentication status. Please try again later.
                        </p>
                        <div class="mt-6">
                            <a href="/" class="inline-block bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-6 rounded-lg transition duration-300">
                                Refresh
                            </a>
                        </div>
                    </div>
                `;
                }
            });
        </script>
    </body>
</html>
