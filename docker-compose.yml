# Production Docker Compose configuration for WhatsApp API Server
services:
  whatsapp-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_BASE_PATH=${BUILD_BASE_PATH:-}
    container_name: whatsapp-api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=${PORT:-3000}
      - BASE_PATH=${BASE_PATH:-}
      - WHATSAPP_CLIENT_NAME=${WHATSAPP_CLIENT_NAME:-whatsapp-api}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DEFAULT_COUNTRY_CODE=${DEFAULT_COUNTRY_CODE:-1}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
    # Volumes to persist data across container restarts
    volumes:
      - ./session-data:/home/bubu/app/session-data  # Maintain WhatsApp sessions
      - ./logs:/home/bubu/app/logs                  # Persist logs
    restart: unless-stopped
    # Health check to ensure the application is running properly
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - whatsapp-network

networks:
  whatsapp-network:
    driver: bridge

volumes:
  session-data:
    driver: local
  logs:
    driver: local